services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: balaji_real_estate
      MYSQL_USER: balaji
      MYSQL_PASSWORD: balaji_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - balaji_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  balaji_mysql:
