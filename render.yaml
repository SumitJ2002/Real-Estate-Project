databases:
  - name: balaji-demo-db
    databaseName: balaji
    user: balaji
    plan: free

services:
  - type: web
    name: balaji-real-estate-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/properties
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: balaji-demo-db
          property: connectionString
      - key: DB_DRIVER
        value: org.postgresql.Driver
      - key: DB_USER
        fromDatabase:
          name: balaji-demo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: balaji-demo-db
          property: password
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "false"
      - key: ADMIN_PASSWORD
        sync: false
